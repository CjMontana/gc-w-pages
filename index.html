<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Witly</title>
  <meta name="description" content="The right words, when you need them.">
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface: #f9f9ff;
      --ink: #111c2d;
      --ink-muted: #536471;
      --primary-teal: #00685f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--surface);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background:
        radial-gradient(110% 85% at 50% -10%, rgba(13, 148, 136, 0.08) 0%, rgba(0, 104, 95, 0.03) 45%, transparent 80%),
        radial-gradient(80% 60% at 85% 90%, rgba(20, 184, 166, 0.05) 0%, transparent 70%),
        radial-gradient(70% 50% at 10% 80%, rgba(0, 104, 95, 0.04) 0%, transparent 60%),
        var(--surface);
    }

    .ambient-glow {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 680px);
      height: min(70vw, 480px);
      background: radial-gradient(circle, rgba(13, 148, 136, 0.07) 0%, rgba(249, 249, 255, 0) 70%);
      pointer-events: none;
      filter: blur(48px);
      z-index: 0;
      animation: subtleBreathe 14s ease-in-out infinite alternate;
    }

    @keyframes subtleBreathe {
      0% { opacity: 0.7; transform: translateX(-50%) scale(0.96); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.04); }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px 64px;
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      animation: pageFadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-logo-wrapper {
      margin-bottom: 36px;
    }

    .hero-logo {
      width: 92px;
      height: 92px;
      border-radius: 24px;
      display: block;
      box-shadow:
        0 14px 34px -8px rgba(0, 104, 95, 0.16),
        0 4px 12px rgba(17, 28, 45, 0.05);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-logo:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 20px 40px -8px rgba(0, 104, 95, 0.2),
        0 6px 16px rgba(17, 28, 45, 0.07);
    }

    h1.brand-title {
      font-family: Syne, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(3.75rem, 9vw, 6.25rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.98;
      color: var(--ink);
      margin-bottom: 20px;
    }

    p.supporting-line {
      font-size: clamp(1.15rem, 2.8vw, 1.45rem);
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink-muted);
      letter-spacing: -0.015em;
      max-width: 520px;
      margin: 0 auto;
    }

    footer {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 28px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .footer-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.2s ease;
      letter-spacing: -0.01em;
      padding: 4px 2px;
    }

    .footer-links a:hover {
      color: var(--primary-teal);
    }

    .separator {
      color: rgba(83, 100, 113, 0.4);
      font-size: 12px;
      user-select: none;
    }

    .copyright {
      font-size: 12px;
      color: rgba(83, 100, 113, 0.65);
      letter-spacing: 0.01em;
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient-glow {
        animation: none;
      }
      main {
        animation: none;
      }
      .hero-logo {
        transition: none;
      }
    }

    @media (max-width: 480px) {
      .hero-logo {
        width: 80px;
        height: 80px;
        border-radius: 20px;
      }
      .hero-logo-wrapper {
        margin-bottom: 28px;
      }
      footer {
        padding-bottom: 28px;
      }
      .footer-links {
        gap: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="ambient-glow" aria-hidden="true"></div>

  <main>
    <div class="hero-logo-wrapper">
      <img src="/logo.png" alt="Witly" class="hero-logo" width="92" height="92">
    </div>
    <h1 class="brand-title">Witly</h1>
    <p class="supporting-line">The right words, when you need them.</p>
  </main>

  <footer>
    <nav aria-label="Footer">
      <ul class="footer-links">
        <li><a href="/privacy">Privacy</a></li>
        <li class="separator" aria-hidden="true">·</li>
        <li><a href="/terms">Terms</a></li>
        <li class="separator" aria-hidden="true">·</li>
        <li><a href="mailto:privacy@glimpseconcepts.com">Contact</a></li>
      </ul>
    </nav>
    <p class="copyright">© 2026 Witly</p>
  </footer>
</body>
</html>
