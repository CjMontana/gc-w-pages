<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Witly</title>
  <meta content="The right words, when you need them." name="description">
  <link href="/logo.png" rel="icon" type="image/png">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet">
  <style>
    :root {
      --surface: #f9f9ff;
      --ink: #111c2d;
      --ink-muted: #536471;
      --primary-teal: #00685f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--surface);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background:
        radial-gradient(110% 85% at 50% -10%, rgba(13, 148, 136, 0.08) 0%, rgba(0, 104, 95, 0.03) 45%, transparent 80%),
        radial-gradient(80% 60% at 85% 90%, rgba(20, 184, 166, 0.05) 0%, transparent 70%),
        radial-gradient(70% 50% at 10% 80%, rgba(0, 104, 95, 0.04) 0%, transparent 60%),
        var(--surface);
    }

    .ambient-glow {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 680px);
      height: min(70vw, 480px);
      background: radial-gradient(circle, rgba(13, 148, 136, 0.07) 0%, rgba(249, 249, 255, 0) 70%);
      pointer-events: none;
      filter: blur(48px);
      z-index: 0;
      animation: subtleBreathe 14s ease-in-out infinite alternate;
    }

    @keyframes subtleBreathe {
      0% { opacity: 0.7; transform: translateX(-50%) scale(0.96); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.04); }
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px 64px;
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      animation: pageFadeIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-logo-wrapper {
      margin-bottom: 36px;
    }

    .hero-logo {
      width: 92px;
      height: 92px;
      display: block;
      overflow: visible;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-logo:hover {
      transform: translateY(-2px) scale(1.02);
    }

    h1.brand-title {
      font-family: Syne, -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: clamp(3.75rem, 9vw, 6.25rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.98;
      color: var(--ink);
      margin-bottom: 20px;
    }

    p.supporting-line {
      font-size: clamp(1.15rem, 2.8vw, 1.45rem);
      font-weight: 400;
      line-height: 1.5;
      color: var(--ink-muted);
      letter-spacing: -0.015em;
      max-width: 520px;
      margin: 0 auto;
    }

    footer {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 28px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 24px;
      list-style: none;
    }

    .footer-links a {
      font-size: 14px;
      font-weight: 500;
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.2s ease;
      letter-spacing: -0.01em;
      padding: 4px 2px;
    }

    .footer-links a:hover {
      color: var(--primary-teal);
    }

    .separator {
      color: rgba(83, 100, 113, 0.4);
      font-size: 12px;
      user-select: none;
    }

    .copyright {
      font-size: 12px;
      color: rgba(83, 100, 113, 0.65);
      letter-spacing: 0.01em;
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient-glow {
        animation: none;
      }
      main {
        animation: none;
      }
      .hero-logo {
        transition: none;
      }
    }

    @media (max-width: 480px) {
      .hero-logo {
        width: 80px;
        height: 80px;
      }
      .hero-logo-wrapper {
        margin-bottom: 28px;
      }
      footer {
        padding-bottom: 28px;
      }
      .footer-links {
        gap: 18px;
      }
    }
  </style>
</head>
<body>
<div aria-hidden="true" class="ambient-glow"></div>

<main>
  <div class="hero-logo-wrapper">
    <svg aria-label="Witly" class="hero-logo" height="92" role="img" viewBox="0 0 512 512" width="92"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="duetLightBg" x1="0%" x2="100%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#ffffff"></stop>
          <stop offset="55%" stop-color="#f8fafc"></stop>
          <stop offset="100%" stop-color="#eef2f6"></stop>
        </linearGradient>
        <linearGradient id="duetLowerLight" x1="0%" x2="100%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#0f766e"></stop>
          <stop offset="100%" stop-color="#044e46"></stop>
        </linearGradient>
        <linearGradient id="duetUpperLight" x1="0%" x2="100%" y1="0%" y2="100%">
          <stop offset="0%" stop-color="#2dd4bf"></stop>
          <stop offset="100%" stop-color="#0d9488"></stop>
        </linearGradient>
        <filter height="140%" id="duetLightShadow" width="140%" x="-20%" y="-20%">
          <feDropShadow dx="0" dy="14" flood-color="#0f172a" flood-opacity="0.12" stdDeviation="18"></feDropShadow>
          <feDropShadow dx="0" dy="4" flood-color="#0d9488" flood-opacity="0.18" stdDeviation="8"></feDropShadow>
        </filter>
        <filter height="140%" id="upperPillShadowLight" width="140%" x="-20%" y="-20%">
          <feDropShadow dx="0" dy="6" flood-color="#0f172a" flood-opacity="0.16" stdDeviation="10"></feDropShadow>
        </filter>
        <style>
          @keyframes gentleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
          }

          @keyframes upperBob {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
          }

          @keyframes lowerSway {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(3px); }
          }

          @keyframes dotPulse {
            0%, 80%, 100% {
              opacity: 0.35;
              transform: scale(0.85);
            }
            40% {
              opacity: 1;
              transform: scale(1.18);
            }
          }

          .icon-floater {
            transform-origin: 256px 256px;
            animation: gentleFloat 6s ease-in-out infinite;
          }

          .lower-bubble {
            transform-origin: 238px 278px;
            animation: lowerSway 6s ease-in-out infinite;
          }

          .upper-bubble {
            transform-origin: 298px 204px;
            animation: upperBob 6s ease-in-out infinite;
          }

          .dot-1 {
            transform-origin: 266px 204px;
            animation: dotPulse 1.8s ease-in-out infinite;
            animation-delay: 0s;
          }

          .dot-2 {
            transform-origin: 298px 204px;
            animation: dotPulse 1.8s ease-in-out infinite;
            animation-delay: 0.22s;
          }

          .dot-3 {
            transform-origin: 330px 204px;
            animation: dotPulse 1.8s ease-in-out infinite;
            animation-delay: 0.44s;
          }

          @media (prefers-reduced-motion: reduce) {
            .icon-floater, .lower-bubble, .upper-bubble, .dot-1, .dot-2, .dot-3 {
              animation: none !important;
              opacity: 1 !important;
              transform: none !important;
            }
          }
        </style>
      </defs>
      <rect fill="url(#duetLightBg)" height="512" rx="116" width="512"></rect>
      <rect fill="none" height="508" rx="114" stroke="#cbd5e1" stroke-opacity="0.8" stroke-width="2.5"
            width="508" x="2" y="2"></rect>
      <g class="icon-floater" filter="url(#duetLightShadow)">
        <g class="lower-bubble">
          <rect fill="url(#duetLowerLight)" height="136" rx="68" width="204" x="136" y="210"></rect>
          <path d="M 180 338 C 152 358 134 382 128 392 C 146 388 180 372 204 346 Z"
                fill="url(#duetLowerLight)"></path>
        </g>
        <g class="upper-bubble" filter="url(#upperPillShadowLight)">
          <rect fill="url(#duetUpperLight)" height="136" rx="68" width="204" x="196" y="136"></rect>
          <circle class="dot-1" cx="266" cy="204" fill="#ffffff" r="11"></circle>
          <circle class="dot-2" cx="298" cy="204" fill="#ffffff" r="11"></circle>
          <circle class="dot-3" cx="330" cy="204" fill="#ffffff" r="11"></circle>
        </g>
      </g>
    </svg>
  </div>
  <h1 class="brand-title">Witly</h1>
  <p class="supporting-line">The right words, when you need them.</p>
</main>

<footer>
  <nav aria-label="Footer">
    <ul class="footer-links">
      <li><a href="/privacy">Privacy</a></li>
      <li aria-hidden="true" class="separator">·</li>
      <li><a href="/terms">Terms</a></li>
      <li aria-hidden="true" class="separator">·</li>
      <li><a href="mailto:privacy@glimpseconcepts.com">Contact</a></li>
    </ul>
  </nav>
  <p class="copyright">© 2026 Witly</p>
</footer>
</body>
</html>
